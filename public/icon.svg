<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="valoraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="valoraAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#valoraBg)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Stylized dynamic 'V' with arrows indicating valuation/exchange -->
  <g filter="url(#subtleGlow)">
    <!-- Left arm of the V -->
    <path d="M128 136 L224 376 L272 376 L208 216 Z" fill="url(#valoraAccent)" />
    <!-- Right arm of the V transitioning into upward arrow / exchange -->
    <path d="M256 336 L344 136 L396 136 L292 376 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Central exchange dot / node -->
  <circle cx="256" cy="376" r="20" fill="#f8fafc" />

  <!-- Exchange arrows indicator inside the V -->
  <path d="M228 170 L284 170 M272 158 L284 170 L272 182" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M284 214 L228 214 M240 202 L228 214 L240 226" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
